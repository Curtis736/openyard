apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-openyard
  labels:
    app.kubernetes.io/name: grafana
    grafana_dashboard: "1"
data:
  openyard.json: |
        {
          "annotations": {"list": []},
          "editable": true,
          "fiscalYearStartMonth": 0,
          "graphTooltip": 0,
          "id": null,
          "links": [],
          "panels": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "fieldConfig": {"defaults": {}, "overrides": []},
              "gridPos": {"h": 8, "w": 6, "x": 0, "y": 0},
              "id": 1,
              "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
              "title": "Workloads",
              "type": "stat",
              "targets": [{"expr": "openyard_workloads", "refId": "A"}]
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "fieldConfig": {"defaults": {}, "overrides": []},
              "gridPos": {"h": 8, "w": 6, "x": 6, "y": 0},
              "id": 2,
              "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
              "title": "Pods ready",
              "type": "stat",
              "targets": [{"expr": "openyard_pods_ready", "refId": "A"}]
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "fieldConfig": {"defaults": {}, "overrides": []},
              "gridPos": {"h": 8, "w": 6, "x": 12, "y": 0},
              "id": 3,
              "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
              "title": "Projects",
              "type": "stat",
              "targets": [{"expr": "openyard_projects", "refId": "A"}]
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "fieldConfig": {"defaults": {}, "overrides": []},
              "gridPos": {"h": 8, "w": 6, "x": 18, "y": 0},
              "id": 4,
              "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
              "title": "Instances running",
              "type": "stat",
              "targets": [{"expr": "openyard_instances_running", "refId": "A"}]
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
              "gridPos": {"h": 10, "w": 24, "x": 0, "y": 8},
              "id": 5,
              "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "single"}},
              "title": "OpenYard gauges",
              "type": "timeseries",
              "targets": [
                {"expr": "openyard_workloads", "legendFormat": "workloads", "refId": "A"},
                {"expr": "openyard_pods_desired", "legendFormat": "pods_desired", "refId": "B"},
                {"expr": "openyard_pods_ready", "legendFormat": "pods_ready", "refId": "C"},
                {"expr": "openyard_projects", "legendFormat": "projects", "refId": "D"}
              ]
            }
          ],
          "schemaVersion": 39,
          "tags": ["openyard"],
          "templating": {"list": []},
          "time": {"from": "now-1h", "to": "now"},
          "timezone": "browser",
          "title": "OpenYard",
          "uid": "openyard",
          "version": 1
        }
