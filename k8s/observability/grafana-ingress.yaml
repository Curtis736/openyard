apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.openyard.local  # /etc/hosts → 127.0.0.1:8080
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
