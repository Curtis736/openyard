apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openyard
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  - quota.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - demo-web.yaml
  - demo-echo.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: openyard
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
