apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openyard-control
  namespace: openyard
  labels:
    app.kubernetes.io/name: openyard-control
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openyard-control
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openyard-obs
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # API Kubernetes (apply / status des workloads)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
