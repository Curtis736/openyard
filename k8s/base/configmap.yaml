apiVersion: v1
kind: ConfigMap
metadata:
  name: openyard-control
  namespace: openyard
  labels:
    app.kubernetes.io/name: openyard-control
data:
  # Secrets (OPENYARD_API_KEY) → Secret openyard-control, pas ici.
  LOG_LEVEL: info
  OPENYARD_NAMESPACE: openyard
  OPENYARD_CLUSTER: "true"
  OPENYARD_DB: /data/openyard.db
  OPENYARD_INGRESS_DOMAIN: openyard.local
  OPENYARD_COMPUTE: sim
  OPENYARD_ALLOWED_IMAGE_PREFIXES: "nginxinc/,nginx:,hashicorp/,ghcr.io/curtis736/,registry.k8s.io/"
