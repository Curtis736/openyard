services:
  control-plane:
    build: .
    ports:
      - "8000:8000"
    environment:
      OPENYARD_CLUSTER: "false"
      OPENYARD_NAMESPACE: openyard
      OPENYARD_DB: /data/openyard.db
      OPENYARD_COMPUTE: sim
      # Optionnel : OPENYARD_API_KEY: change-me
    volumes:
      - openyard-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 8s

volumes:
  openyard-data:
