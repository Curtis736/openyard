name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  LOCAL_TAG: openyard:ci

jobs:
  lint-test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  kustomize:
    name: Kustomize + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install kustomize and kubeconform
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz" | tar -xz
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" | tar -xz
          sudo mv kustomize kubeconform /usr/local/bin/

      - name: Validate manifests
        run: |
          kustomize build k8s/base | kubeconform -strict -ignore-missing-schemas -summary
          kustomize build k8s/overlays/kind | kubeconform -strict -ignore-missing-schemas -summary
          kustomize build k8s/observability | kubeconform -strict -ignore-missing-schemas -summary

  e2e-kind:
    name: E2E kind
    needs: [lint-test, kustomize]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.31.0

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.0
        with:
          cluster_name: openyard
          config: kind-config.yaml
          wait: 120s

      - name: Install ingress-nginx
        run: |
          set -euo pipefail
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx wait --for=condition=ready pod \
            -l app.kubernetes.io/component=controller --timeout=180s

      - name: Build and load image
        run: |
          set -euo pipefail
          docker build -t openyard:local .
          kind load docker-image openyard:local --name openyard

      - name: Deploy OpenYard
        run: |
          set -euo pipefail
          kubectl get ns openyard >/dev/null 2>&1 || kubectl create namespace openyard
          ./scripts/ensure-admin-secret.sh
          kubectl apply -k k8s/overlays/kind
          kubectl -n openyard rollout status deployment/openyard-control --timeout=180s

      - name: Deploy observability
        run: |
          set -euo pipefail
          kubectl apply -k k8s/observability
          kubectl -n openyard-obs rollout status deploy/prometheus --timeout=180s
          kubectl -n openyard-obs rollout status deploy/grafana --timeout=180s

      - name: Smoke e2e
        run: ./scripts/e2e-kind.sh

      - name: Smoke e2e multi-tenant
        run: ./scripts/e2e-tenant.sh

  docker:
    name: Build, scan, push
    needs: [lint-test, kustomize]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/curtis736/openyard
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy (CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_TAG }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Trivy (HIGH, report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_TAG }}
          severity: HIGH
          exit-code: "0"
          ignore-unfixed: true
          format: table
          skip-setup-trivy: true

      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
