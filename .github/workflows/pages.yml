name: Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare static landing
        run: |
          mkdir -p _site
          cp web/index.html _site/
          cp -R web/assets _site/assets
          # Chemins relatifs pour https://<user>.github.io/openyard/
          sed -i 's|href="/assets/|href="./assets/|g' _site/index.html
          # Console / docs OpenAPI = self-host ; liens publics vers le dépôt
          sed -i 's|href="/console"|href="https://github.com/Curtis736/openyard#site--console"|g' _site/index.html
          sed -i 's|href="/docs"|href="https://github.com/Curtis736/openyard/tree/main/docs"|g' _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
